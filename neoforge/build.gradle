dependencies {
    // External player dependencies; normal implementation/runtimeOnly never bundles them.
    implementation("me.fzzyhmstrs:fzzy_config:${fzzy_config_neoforge_version}") {
        // The exact external KotlinForForge runtime is declared below from Modrinth.
        exclude group: 'thedarkcolour', module: 'kotlinforforge-neoforge'
    }
    runtimeOnly("maven.modrinth:kotlin-for-forge:${kotlin_for_forge_version}")

    // UILib and its required Architectury runtime are part of the released mod through NeoForge's native Jar-in-Jar container.
    jarJar(implementation("com.daqem.uilib:uilib-neoforge:${uilib_version}")) {
        version {
            prefer uilib_version
        }
    }
    jarJar(implementation("dev.architectury:architectury-neoforge:${architectury_version}")) {
        version {
            strictly "${architectury_version}"
            prefer "${architectury_version}"
        }
    }

    // Optional compatibility targets: compile surface only, never bundled or forced on players.
    compileOnly("curse.maven:neocontinuity-1377279:${neocontinuity_neoforge_file}")
    // NeoContinuity exposes Fabric renderer API types in its public constructors; these are the
    // same org.sinytra.forgified-fabric-api artifacts NeoContinuity bundles via Jar-in-Jar.
    // Compile-only surface; never shipped and players never install Forgified separately.
    compileOnly("org.sinytra.forgified-fabric-api:fabric-renderer-api-v1:${ffapi_renderer_api_version}")
    compileOnly("org.sinytra.forgified-fabric-api:fabric-api-base:${ffapi_base_version}")
    compileOnly("curse.maven:ctm-267602:${ctm_neoforge_file}")
    compileOnly("maven.modrinth:fusion-connected-textures:${fusion_neoforge_version}")
    compileOnly("maven.modrinth:athena-ctm:${athena_neoforge_version}")
    // Development validation intentionally loads exactly one optional engine.
    validationEngineDependencies[validationEngine].each { dependency ->
        runtimeOnly(dependency)
    }

    // 中文：与 1.21.1 fabric/build.gradle 锁定的 JUnit 测试配置一致；仅测试范围，
    // 不进入生产依赖，版本与 fabric 锁定完全相同。
    // English: Same locked JUnit test configuration as 1.21.1 fabric/build.gradle;
    // test scope only, never bundled, versions identical to the fabric pin.
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 中文：仅供 CtmModNativeConnectionSampler 合同测试解析 ConnectionCheck/CTMLogic；
    // testRuntimeOnly 只进测试运行时类路径，不进入生产 jar，也不改变默认开发
    // validation engine 的 runtimeOnly 注入。
    // English: Test-only runtime for CtmModNativeConnectionSampler contract tests to
    // resolve ConnectionCheck/CTMLogic; testRuntimeOnly never enters the production
    // jar and never changes the default development validation-engine runtimeOnly.
    testRuntimeOnly("curse.maven:ctm-267602:${ctm_neoforge_file}")
    // 中文：仅供 Athena 合同测试解析 Athena 4.0.6 模型/CtmState/Provider API；
    // testRuntimeOnly 只进测试运行时类路径，不进入生产 jar，也不改变默认开发
    // validation engine 的 runtimeOnly 注入（默认仍为 continuity）。
    // English: Test-only runtime for Athena contract tests to resolve Athena 4.0.6
    // model/CtmState/provider APIs; testRuntimeOnly stays on the test runtime
    // classpath only, never bundled into the production jar, and never changes the
    // default development validation-engine runtimeOnly injection (still continuity).
    testRuntimeOnly("maven.modrinth:athena-ctm:${athena_neoforge_version}")
    // 中文：仅供 Athena 合同测试在默认（continuity）validation 配置下也能编译解析
    // Athena 4.0.6 模型/CtmState/Provider API；testCompileOnly 只进测试编译类路径，
    // 不进入生产 jar，也不改变默认开发 validation engine 的 runtimeOnly 注入
    // （默认仍为 continuity）。与上方 testRuntimeOnly 同版本同用途，仅作用阶段不同。
    // English: Test-compile-only Athena 4.0.6 model/CtmState/provider APIs so Athena
    // contract tests compile under the default (continuity) validation configuration;
    // testCompileOnly stays on the test compile classpath only, never bundled into the
    // production jar, and never changes the default development validation-engine
    // runtimeOnly injection (still continuity). Same version and purpose as the
    // testRuntimeOnly above, differing only in the phase it affects.
    testCompileOnly("maven.modrinth:athena-ctm:${athena_neoforge_version}")
    // 中文：仅供 NeoForge Fusion 包装器合同测试解析 Fusion 1.3.12 Quad/API；
    // 测试依赖不进入生产 jar，也不改变所选开发验证引擎。
    // English: Test-only Fusion 1.3.12 Quad/API surface for the NeoForge Fusion
    // wrapper contract tests; never bundled and never changes the selected
    // development validation engine.
    testCompileOnly("maven.modrinth:fusion-connected-textures:${fusion_neoforge_version}")
    testRuntimeOnly("maven.modrinth:fusion-connected-textures:${fusion_neoforge_version}")
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Real-widget contract tests also need the Mojang-named Minecraft runtime that ModDevGradle
// puts on the main runtime classpath (UILib static init touches com.mojang.logging.LogUtils).
configurations.named('testRuntimeClasspath') {
    extendsFrom configurations.runtimeClasspath
}

// 中文：最小补齐测试源码集的 Mojang 映射 Minecraft/NeoForge client 编译类路径；
// 仅测试范围，与上方 testRuntimeClasspath 同一来源，不进入生产依赖。
// English: Minimal wiring of the Mojang-mapped Minecraft/NeoForge client compile
// classpath into the test source set; test scope only, same source as the
// testRuntimeClasspath above, never bundled into production.
configurations.named('testCompileClasspath') {
    extendsFrom configurations.runtimeClasspath
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

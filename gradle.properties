# Important Notes:
# Every metadata field must be represented in build-logic/src/main/groovy/multiloader-common.gradle.

# Project
version=1.0.2
group=com.kltyton
java_version=17

# Common
minecraft_version=1.20.1
mod_name=AutoSeamBlend
mod_author=kltyton
mod_id=autoseamblend
license=LGPL-3.0-or-later
credits=
description=Automatic connected textures for Minecraft, editable and exportable in-game.
minecraft_version_range=[1.20.1,1.20.2)

# Parchment parameter/javadoc mappings layered on top of official Mojang mappings.
# 2023.09.03 is the latest stable Parchment release for 1.20.1 (verified via maven.parchmentmc.org).
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric, see https://fabricmc.net/develop/ for new versions
# 0.92.11+1.20.1 is the latest stable Fabric API for 1.20.1; Loom 1.17.17 is a stable release.
fabric_version=0.92.11+1.20.1
fabric_loader_version=0.19.3
loom_version=1.17.17

# Forge, see https://files.minecraftforge.net for new versions
# 47.4.22 is the latest 1.20.1 Forge; LegacyForge ModDevGradle 2.0.143 is the newest plugin.
forge_version=47.4.22
forge_loader_version_range=[47,)

# Required external configuration library. Never bundle or shadow it.
fzzy_config_fabric_version=0.7.6+1.20.1
fzzy_config_forge_version=0.7.6+1.20.1+forge
fabric_language_kotlin_version=1.13.13+kotlin.2.4.10
kotlin_for_forge_file=5402061

# Optional development-only compatibility targets. Never bundle them.
# Modrinth dependencies use readable project slugs and version numbers (verified 2026-08-10).
continuity_fabric_version=3.0.0+1.20.1
# Forge supports two interchangeable Continuity-family implementations. The official
# Connector build needs Sinytra Connector and Forgified Fabric API; Constancy is the native fork.
continuity_forge_version=3.0.0+1.20.1.forge
continuity_forge_id=9KbAcWSO
constancy_forge_version=0.1.1+1.20.1.forge.build.4
connector_forge_id=1MQDrKN7
forgified_fabric_api_forge_id=XweDEycJ
fusion_fabric_version=1.3.12-fabric-mc1.20.1
fusion_forge_version=1.3.12-forge-mc1.20.1
# Athena 3.1.2 ships distinct Fabric/Forge 1.20.1 files under one version number;
# Modrinth version ids disambiguate them (fabric mXJWSwbJ, forge DULOQFj7).
athena_fabric_id=mXJWSwbJ
athena_forge_id=DULOQFj7
# UILib 0.3.6 also reuses one version number for both loaders; ids disambiguate
# (fabric zTkzAdVf, forge GizE27iH). Architectury 9.2.14 is UILib's required runtime.
uilib_version=0.3.6
uilib_fabric_id=zTkzAdVf
uilib_forge_id=GizE27iH
architectury_version=9.2.14
# CTM Mod 1.20.1-1.1.10 is the latest 1.20.1 release (CurseForge project 267602).
# File ID 5983309 (2024-12-11, CTM-1.20.1-1.1.10.jar) verified via the official CurseForge
# page (https://www.curseforge.com/minecraft/mc-mods/ctm/files/5983309). The earlier
# 3052766 was a wrong-era file whose jar was official-obfuscated-mapped and did not match
# 1.20.1 Mojang names.
ctm_forge_file=5983309

# Development validation engine per loader (only one optional engine at runtime).
autoseamblend_validation_engine=continuity
autoseamblend_fabric_validation_engine=continuity

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

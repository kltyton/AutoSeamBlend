# Important Notes:
# Every metadata field must be represented in build-logic/src/main/groovy/multiloader-common.gradle.

# Project
version=0.1.0-SNAPSHOT
group=com.kltyton
java_version=25

# Common
minecraft_version=26.1.2
mod_name=AutoSeamBlend
mod_author=kltyton
mod_id=autoseamblend
license=LGPL-3.0-or-later
credits=
description=连接纹理与确定性材质接缝混合
minecraft_version_range=[26.1.2,)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.155.2+26.1.2
fabric_loader_version=0.19.3

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.94
neoforge_loader_version_range=[4,)

# Required external configuration library. Never bundle or shadow it.
fzzy_config_fabric_version=0.7.6+26.1
fzzy_config_neoforge_version=0.7.6+26.1+neoforge
fabric_language_kotlin_version=1.13.13+kotlin.2.4.10
kotlin_for_forge_2612_file=7736203

# Optional development-only compatibility targets. Never bundle them.
# Modrinth dependencies use readable project slugs and version numbers.
continuity_fabric_version=3.0.1-beta.2+26.1
fusion_fabric_version=1.3.12-fabric-mc26.1
fusion_neoforge_version=1.3.12-neoforge-mc26.1
# CurseForge file ids disambiguate Athena's same-numbered Fabric/NeoForge releases.
athena_fabric_file=7970443
athena_neoforge_file=7970442
# CurseForge file ids for NeoContinuity 3.0.1-0.0.8 and CTM Lib 26.1.2.2.
neocontinuity_neoforge_file=8384810
ctm_lib_neoforge_file=8260644
# Current M14 manual-acceptance target. Plain :neoforge:runClient must load CTM Lib, not the default Continuity engine.
autoseamblend_validation_engine=ctm
# Fabric development runs load exactly one supported engine; Fabric has no CTM Mod target.
autoseamblend_fabric_validation_engine=continuity

# Loader-specific modular UI bundled through the loader's native Jar-in-Jar mechanism.
uilib_version=20.1.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

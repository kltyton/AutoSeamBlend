plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)

dependencies {
    // Fusion's public connecting-layout ABI is shared by the Loader adapters; each Loader still supplies its own runtime artifact.
    compileOnly("maven.modrinth:fusion-connected-textures:${fusion_fabric_version}") {
        attributes { attribute(loaderAttribute, 'fabric') }
    }
    // 中文：Fusion 合同测试在测试源集直接编译并运行 Fusion 1.3.12 公开 ABI
    // （ConnectingTextureData / ConnectingTextureLayoutHandler）；testImplementation 仅把锁定
    // 版本放入测试 classpath，不进入生产/runtime artifact。
    // English: Fusion contract tests compile and run against Fusion 1.3.12's public ABI
    // (ConnectingTextureData / ConnectingTextureLayoutHandler) directly in the test source set;
    // testImplementation puts the locked version on the test classpath only, never on
    // production/runtime artifacts.
    testImplementation("maven.modrinth:fusion-connected-textures:${fusion_fabric_version}") {
        attributes { attribute(loaderAttribute, 'fabric') }
    }
    // Common UILib widgets compile against the byte-identical Fabric API jar; each Loader supplies its native artifact at runtime.
    compileOnly("com.daqem.uilib:uilib-fabric:${uilib_version}") {
        attributes { attribute(loaderAttribute, 'fabric') }
    }
    // Continuity's Fabric and NeoForge builds expose the byte-identical ABI used by the common capture bridge; each Loader supplies its native artifact at runtime.
    compileOnly("maven.modrinth:continuity:${continuity_fabric_version}") {
        attributes { attribute(loaderAttribute, 'fabric') }
    }
    // Athena's Fabric/NeoForge CtmState ABI is byte-identical; common compiles against Fabric while each Loader supplies its native artifact at runtime.
    compileOnly("curse.maven:athena-841890:${athena_fabric_file}") {
        attributes { attribute(loaderAttribute, 'fabric') }
    }
    // Fabric and NeoForge both bundle Fabric Mixin, so it is safe to use it in common
    // If you need to update, check what version they are using to see what is compatible
    // https://github.com/neoforged/NeoForge/blob/26.1.x/gradle.properties#L37
    // https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    // Fabric and NeoForge both bundle MixinExtras, so it is safe to use it in common
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.4'))
    // Version-local Fzzy schema types are compiled here; each Loader supplies its exact runtime artifact.
    compileOnly("me.fzzyhmstrs:fzzy_config:${fzzy_config_fabric_version}") {
        attributes { attribute(loaderAttribute, 'fabric') }
    }
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

// 中文：Athena 合同测试需要 Mojang 命名的 Minecraft client 类型（Gson/JOML/
// TextureAtlasSprite 等）；ModDevGradle 只把它们放到主源集 compile/runtime classpath，
// 测试源集默认不包含，故沿用 1.21.1 既有做法继承主 runtimeClasspath，不重复声明或升级依赖。
// English: The Athena contract tests need the Mojang-named Minecraft client types
// (Gson/JOML/TextureAtlasSprite etc.); ModDevGradle only puts them on the main
// source-set compile/runtime classpaths, which the test source set lacks by default.
// Following the established 1.21.1 practice, the test configurations inherit the main
// runtimeClasspath; no dependency is re-declared or upgraded.
configurations.named('testRuntimeClasspath') {
    extendsFrom configurations.runtimeClasspath
}

// 中文：测试运行同样需要 Minecraft 运行时（Bootstrap.bootStrap 等）。
// English: Test execution likewise needs the Minecraft runtime (Bootstrap.bootStrap etc.).
configurations.named('testCompileClasspath') {
    extendsFrom configurations.runtimeClasspath
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

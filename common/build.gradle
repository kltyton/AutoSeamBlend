// 不依赖 Forgified maven 坐标。当前采用下方显式 Forgified 编译依赖（更常规）。
// Alternative (commented out for reference): extract the Mojang-named Fabric renderer API from
// NeoContinuity's own Jar-in-Jar at build time, avoiding any Forgified maven coordinate.

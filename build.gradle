plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev.legacyforge' version '2.0.143' apply false
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net')
            content {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
        maven {
            name = 'FzzyConfig'
            url = uri('https://maven.fzzyhmstrs.me')
            content {
                includeGroup('me.fzzyhmstrs')
            }
        }
        maven {
            name = 'TerraformersMC'
            url = uri('https://maven.terraformersmc.com')
            content {
                includeGroupAndSubgroups('com.terraformersmc')
            }
        }
        maven {
            name = 'Modrinth'
            url = uri('https://api.modrinth.com/maven')
            content {
                includeGroup('maven.modrinth')
            }
        }
        maven {
            name = 'CurseMaven'
            url = uri('https://www.cursemaven.com')
            content {
                includeGroup('curse.maven')
            }
        }
        maven {
            name = 'DAQEMStudios'
            url = uri('https://maven.daqem.com/releases')
            content {
                includeGroup('com.daqem.uilib')
            }
        }
        maven {
            name = 'Architectury'
            url = uri('https://maven.architectury.dev')
            content {
                includeGroup('dev.architectury')
            }
        }
        maven {
            name = 'ParchmentMC'
            url = uri('https://maven.parchmentmc.org')
            content {
                includeGroup('org.parchmentmc.data')
            }
        }
        maven {
            name = 'Sinytra'
            url = uri('https://maven.su5ed.dev/releases')
            content {
                includeGroup('org.sinytra.forgified-fabric-api')
            }
        }
    }
}

# Important Notes:
# Every metadata field must be represented in build-logic/src/main/groovy/multiloader-common.gradle.

# Project
version=1.0.2
group=com.kltyton
java_version=21

# Common
minecraft_version=1.21.1
mod_name=AutoSeamBlend
mod_author=kltyton
mod_id=autoseamblend
license=LGPL-3.0-or-later
credits=
description=连接纹理与确定性材质接缝混合
minecraft_version_range=[1.21.1,1.21.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.116.15+1.21.1
fabric_loader_version=0.19.3
# Loom for the obfuscated Minecraft plugin (net.fabricmc.fabric-loom-remap).
# 1.17-SNAPSHOT is what the official Fabric 1.21.1 example mod pins; stable 1.17.17 fails to remap
# fabric-api 0.116.x due to an upstream duplicate package-info in fabric-convention-tags-v2.
loom_version=1.17-SNAPSHOT

# Parchment parameter/javadoc mappings layered on top of official Mojang mappings.
parchment_minecraft_version=1.21.1
parchment_version=2024.11.17

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.1.248
neoforge_loader_version_range=[4,)

# Required external configuration library. Never bundle or shadow it.
fzzy_config_fabric_version=0.7.6+1.21
fzzy_config_neoforge_version=0.7.6+1.21+neoforge
fabric_language_kotlin_version=1.13.13+kotlin.2.4.10
kotlin_for_forge_version=5.12.0

# Optional development-only compatibility targets. Never bundle them.
# Modrinth dependencies use readable project slugs and version numbers.
continuity_fabric_version=3.0.0+1.21
# NeoForge uses the native NeoContinuity fork (Mojang-named, no Sinytra Connector);
# the Modrinth "3.0.0+1.21.neoforge" build is Connector-intermediary and cannot link in common.
continuity_neoforge_version=3.0.0+0.0.1+1.21.1.neoforge
neocontinuity_neoforge_file=7178602
fusion_fabric_version=1.3.12-fabric-mc1.21
fusion_neoforge_version=1.3.12-neoforge-mc1.21.1
athena_fabric_version=4.0.6-fabric,1.21.1
athena_neoforge_version=4.0.6-neoforge,1.21.1
# CurseForge file id disambiguates CTM's NeoForge 1.21.1 release (CTM-1.21-1.2.1+3).
ctm_neoforge_file=5587515

# Loader-specific modular UI bundled through the loader's native Jar-in-Jar mechanism.
# UILib 9.0.0 is the newest build supporting Minecraft 1.21.1 and requires Architectury >=13.0.6.
uilib_version=9.0.0
architectury_version=13.0.11

# Explicit Mojang-named Forgified Fabric API compile surface. NeoContinuity's public constructors
# expose Fabric renderer API types (BlendMode etc.) and its Jar-in-Jar bundles the very same
# org.sinytra.forgified-fabric-api artifacts, so players never install Forgified separately.
# This dependency is compile-only and never shipped.
ffapi_renderer_api_version=3.4.1+9125b6dc19
ffapi_base_version=0.4.42+d1308dedd1

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
